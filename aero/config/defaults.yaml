# Aero Agent Default Configuration
# Override any value via environment variables prefixed with AERO_
# Example: AERO_SERVER_PORT=9000 overrides server.port

# Application settings
app:
  name: "Aero Agent"
  version: "0.1.0"
  debug: false
  log_level: "INFO"

# Server configuration
server:
  host: "127.0.0.1"
  port: 8000
  reload: false
  workers: 1

# RAG configuration
rag:
  store_path: "./data/rag_store"
  embedding_model: "local"
  chunk_size: 512
  chunk_overlap: 50
  top_k: 5

# OCR configuration
ocr:
  default_backend: "tesseract"
  tesseract_cmd: null  # Auto-detect from PATH
  confidence_threshold: 0.6
  preprocessing: true

# Simulation configuration
simulation:
  default_solver: "fd"
  max_iterations: 10000
  convergence_threshold: 1.0e-6
  device: "auto"  # auto, cpu, cuda

# Web search configuration
web:
  user_agent: "Aero-Agent/0.1.0"
  timeout: 30
  max_retries: 3
  rate_limit_delay: 1.0

# Experiment configuration
experiments:
  camera_index: 0
  sensor_poll_interval: 0.1
  data_output_dir: "./data/experiments"

# Pipeline configuration
pipeline:
  max_concurrent_tasks: 4
  task_timeout: 300
  retry_on_failure: true
  max_retries: 3

# Logging configuration
logging:
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: null  # Set to path for file logging
  max_bytes: 10485760  # 10MB
  backup_count: 5
