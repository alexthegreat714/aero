# Aero Agent Default Configuration
# Override any value via environment variables prefixed with AERO_
# Example: AERO_SERVER_PORT=9000 overrides server.port

# Application settings
app:
  name: "Aero Agent"
  version: "0.1.0"
  debug: false
  log_level: "INFO"

# Server configuration
server:
  host: "127.0.0.1"
  port: 8000
  reload: false
  workers: 1

# RAG configuration
rag:
  # Storage settings
  store_backend: "auto"  # auto, duckdb, sqlite, memory
  store_path: "./data/rag_store.db"

  # Embedding settings
  embedding_backend: "auto"  # auto, ollama, sentence_transformers, hash
  embedding_model: "nomic-embed-text"  # For Ollama
  embedding_model_st: "all-MiniLM-L6-v2"  # For SentenceTransformers
  embedding_dimension: 384

  # Chunking settings
  chunk_size: 512
  chunk_overlap: 102  # ~20% of chunk_size
  chunk_min_size: 100
  chunk_respect_sentences: true

  # Search settings
  top_k: 5
  similarity_threshold: 0.0

  # Preprocessing
  preprocess:
    remove_boilerplate: true
    extract_equations: true
    fix_hyphens: true
    normalize_whitespace: true

  # Document ingestion
  ingestion:
    max_file_size_mb: 50
    supported_formats:
      - ".txt"
      - ".md"
      - ".pdf"
      - ".docx"
      - ".html"
      - ".htm"
      - ".json"
      - ".yaml"
      - ".yml"
      - ".rst"
      - ".csv"
    ocr_enabled: true
    ocr_for_images: true

# OCR configuration
ocr:
  default_backend: "auto"  # auto, tesseract, deepseek, easyocr
  tesseract_cmd: null  # Auto-detect from PATH
  tesseract_lang: "eng"
  confidence_threshold: 0.6
  preprocessing: true
  deepseek:
    model: "deepseek-vl"
    host: "http://localhost:11434"
  easyocr:
    languages: ["en"]
    gpu: true

# Simulation configuration
simulation:
  default_solver: "fd"
  default_grid_size: 64
  default_dt: 0.001
  max_steps: 5000
  max_iterations: 10000
  convergence_threshold: 1.0e-6
  device: "auto"  # auto, cpu, cuda

  # PINN configuration
  pinn:
    layers: [2, 64, 64, 64, 1]
    lr: 0.001
    epochs: 5000
    activation: "tanh"
    lambda_physics: 1.0
    lambda_bc: 10.0

  # CFD configuration
  cfd:
    viscosity: 0.01
    density: 1.0
    cfl_number: 0.5

  # Heat equation
  heat:
    alpha: 0.01
    default_dt: 0.0001

  # Laplace equation
  laplace:
    omega: 1.0  # SOR relaxation (1.0 = Gauss-Seidel)

# Web search configuration
web:
  user_agent: "Aero-Agent/0.1.0"
  timeout: 30
  max_retries: 3
  rate_limit_delay: 1.0

# Experiment configuration
experiments:
  # Camera settings
  camera:
    default_index: 0
    default_width: 640
    default_height: 480
    default_fps: 30
    capture_format: "png"

  # Optical flow settings
  flow:
    pyr_scale: 0.5
    levels: 3
    winsize: 15
    iterations: 3
    poly_n: 5
    poly_sigma: 1.2
    motion_threshold: 1.0  # Magnitude threshold for motion detection

  # Sensor settings
  sensor:
    poll_interval: 0.1
    buffer_size: 1000
    supported_formats:
      - ".csv"
      - ".json"
      - ".txt"

  # Motion detection
  motion:
    threshold: 25
    min_area: 500
    dilate_iterations: 2

  # Synthetic experiments
  synthetic:
    default_seed: null  # null for random
    default_flow_type: "uniform"
    default_pattern: "sine"

  # Output settings
  data_output_dir: "./data/experiments"
  save_raw_frames: false
  max_stored_experiments: 100

# Pipeline configuration
pipeline:
  max_concurrent_tasks: 4
  task_timeout: 300
  retry_on_failure: true
  max_retries: 3

# Reasoning configuration (Scientific Reasoning Loop)
reasoning:
  max_iterations: 5
  confidence_threshold: 0.85
  drop_threshold: 0.2
  pattern_convergence_eps: 1.0e-3
  max_simulations_per_iteration: 3
  timeout_per_simulation: 60.0
  use_surrogates: true  # Enable surrogate model usage when available

  # Hypothesis generation
  hypothesis:
    num_initial: 3
    use_rag: true
    use_templates: true

  # Refinement settings
  refinement:
    validation_strong_bonus: 0.15
    validation_weak_penalty: -0.15
    pattern_match_bonus: 0.10
    iteration_bonus: 0.02

  # Pattern detection
  patterns:
    symmetry_threshold: 0.05
    periodicity_power_threshold: 0.5
    oscillation_crossing_rate: 0.2
    shock_gradient_ratio: 5.0

# Logging configuration
logging:
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: null  # Set to path for file logging
  max_bytes: 10485760  # 10MB
  backup_count: 5

# Database configuration (for metadata)
database:
  backend: "auto"  # auto, duckdb, sqlite
  path: "./data/aero_metadata.db"

# Data Lake configuration
data:
  # Storage backend: duckdb (preferred) or sqlite (fallback)
  backend: "auto"  # auto, duckdb, sqlite

  # Database path for simulation/experiment records
  db_path: "./data/aero.db"

  # Directory for storing large field arrays as .npz files
  fields_dir: "./data/fields"

  # Auto-persist settings
  auto_persist_simulations: true
  auto_persist_experiments: true

  # Cleanup settings
  max_records_per_type: 1000  # Max records before cleanup warning
  cleanup_after_days: 90     # Auto-cleanup records older than this

# Surrogate Model configuration
surrogates:
  # Directory for storing trained models
  models_dir: "./data/models"

  # Default training parameters
  default_hidden_dims: [64, 64]
  default_epochs: 100
  default_batch_size: 64
  default_lr: 0.001

  # Data limits
  max_training_records: 50
  samples_per_simulation: 1000

  # Model types
  supported_types:
    - mlp
    - pinn
